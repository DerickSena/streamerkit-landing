<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Idioma automático. Só age na página raiz (português) e só troca de endereço se:
      // 1) a pessoa já escolheu outro idioma antes (fica guardado em "sk-lang"), ou
      // 2) é a primeira visita e o navegador dela não está em português.
      // Quem chega direto no endereço de um idioma (/en/, /de/, /ja/...) fica onde está. Robôs de busca e de prévia de link não são redirecionados.
      ;(function () {
        try {
          var p = location.pathname
          if (p !== '/' && p !== '/index.html') return
          if (/bot|crawl|spider|slurp|lighthouse|pagespeed|headless|facebookexternalhit|whatsapp|telegram|discord|preview/i.test(navigator.userAgent)) return
          var want = null
          try {
            want = localStorage.getItem('sk-lang')
          } catch (e) {}
          if (!want) {
            var l = ((navigator.languages && navigator.languages[0]) || navigator.language || 'pt').toLowerCase()
            var p2 = l.slice(0, 2)
            want = p2 === 'pt' ? 'pt' : l === 'es-es' ? 'es' : p2 === 'es' ? 'es-419' : /^(de|fr|it|ja|ko|zh)$/.test(p2) ? p2 : 'en'
          }
          var map = { en: '/en/', es: '/es/', 'es-419': '/es-419/', de: '/de/', fr: '/fr/', it: '/it/', ja: '/ja/', ko: '/ko/', zh: '/zh/' }
          if (map[want]) location.replace(map[want] + location.search + location.hash)
        } catch (e) {}
      })()
    </script>
    <!--seo-->
    <title>Servidor de live IRL que não deixa a live cair | StreamerKit</title>
    <meta
      name="description"
      content="Sua live IRL caiu de novo? O StreamerKit junta 4G, 5G e Wi-Fi numa transmissão só (SRTLA), segura a live com BRB automático, roda o OBS na nuvem e transmite para Twitch, Kick e YouTube ao mesmo tempo."
    />
    <link rel="canonical" href="https://streamerkit.net/" />
    <!--/seo-->
    <meta name="theme-color" content="#140404" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <noscript>
      <style>
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <link rel="preload" as="image" type="image/webp" href="/media/show.webp" fetchpriority="high" />
  </head>
  <body class="grain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
